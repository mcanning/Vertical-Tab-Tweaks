<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Tabs</title>
  <link rel="stylesheet" href="sidebar.css">
  <script type="module" src="sidebar.js"></script>
</head>
<body>
  <header class="panel-header">
    <img src="icon.svg" alt="" class="panel-mark">
    <h1>Tabs</h1>
    <span id="count" class="tab-count"></span>
    <button id="new-tab" class="icon-button new-tab" type="button" aria-label="New tab" title="New tab">+</button>
  </header>
  <main>
    <ul id="tabs" aria-label="Tabs in this window"></ul>
  </main>
  <p id="status" role="status" hidden></p>
  <template id="tab-row">
    <li class="tab-row">
      <button class="open-tab" type="button">
        <span class="tab-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round">
            <path d="M4.5 2.5h4l3 3v8h-7zM8.5 2.5v3h3"/>
          </svg>
          <img alt="" hidden>
        </span>
        <span class="tab-title" dir="auto"></span>
        <svg class="pin" aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" hidden>
          <path d="m8 10 1.5 1.5 2-2L10 8l1.5-3 1 1 1-1-3-3-1 1 1 1L7.5 5.5 6 4 4 6l1.5 1.5L8 10ZM6.8 8.8l-3.5 3.5"/>
        </svg>
      </button>
      <button class="icon-button row-action" type="button"></button>
    </li>
  </template>
</body>
</html>

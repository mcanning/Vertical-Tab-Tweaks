// Native Tab Minus loader. Firefox skips this first line.
try {
  (() => {
    const classes = Components.classes;
    const interfaces = Components.interfaces;
    const app = classes['@mozilla.org/xre/app-info;1'].getService(interfaces.nsIXULRuntime);
    if (app.inSafeMode) return;
    const obs = classes['@mozilla.org/observer-service;1'].getService(interfaces.nsIObserverService);
    const dirs = classes['@mozilla.org/file/directory_service;1'].getService(interfaces.nsIProperties);
    const io = classes['@mozilla.org/network/io-service;1'].getService(interfaces.nsIIOService);
    const loader = classes['@mozilla.org/moz/jssubscript-loader;1'].getService(interfaces.mozIJSSubScriptLoader);
    const observer = {
      observe(win) {
        if (win.document.documentURI !== 'chrome://browser/content/browser.xhtml') return;
        const script = dirs.get('ProfD', interfaces.nsIFile);
        script.append('chrome');
        script.append('native-tab-minus.uc.js');
        if (!script.exists()) return;
        try {
          const resource = io.getProtocolHandler('resource').QueryInterface(interfaces.nsIResProtocolHandler);
          resource.setSubstitution('native-tab-minus', io.newFileURI(script.parent));
          loader.loadSubScript('resource://native-tab-minus/native-tab-minus.uc.js', win, 'UTF-8');
        } catch (error) {
          Components.utils.reportError(error);
        }
      }
    };
    obs.addObserver(observer, 'browser-delayed-startup-finished');
  })();
} catch (error) {
  Components.utils.reportError(error);
}
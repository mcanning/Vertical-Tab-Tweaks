// Firefox skips the first line of an AutoConfig script.
(() => {
  const { classes: Cc, interfaces: Ci } = Components;
  const app = Cc["@mozilla.org/xre/app-info;1"].getService(Ci.nsIXULRuntime);
  if (app.inSafeMode) return;

  const dirs = Cc["@mozilla.org/file/directory_service;1"].getService(Ci.nsIProperties);
  if (dirs.get("ProfD", Ci.nsIFile).leafName !== "YOUR_PROFILE_DIRECTORY") return;

  const observer = Cc["@mozilla.org/observer-service;1"].getService(Ci.nsIObserverService);
  observer.addObserver(win => {
    if (win.document.documentURI !== "chrome://browser/content/browser.xhtml") return;
    try {
      install(win);
      void installToolsDrag(win).catch(error => Components.utils.reportError(error));
    } catch (error) {
      Components.utils.reportError(error);
    }
  }, "browser-delayed-startup-finished");

  async function installToolsDrag(win) {
    const host = win.document.querySelector("sidebar-main");
    if (!host) return;
    await win.customElements.whenDefined("sidebar-main");
    await host.updateComplete;
    const root = host.shadowRoot;
    if (!root || root.getElementById("vertical-sidebar-tools-drag")) return;

    const style = win.document.createElementNS("http://www.w3.org/1999/xhtml", "style");
    style.id = "vertical-sidebar-tools-drag";
    style.textContent = `
      @media -moz-pref("sidebar.verticalTabs") {
        .buttons-wrapper { -moz-window-dragging: drag; }
        .buttons-wrapper :is(moz-button, button, toolbarbutton) {
          -moz-window-dragging: no-drag;
        }
      }
    `;
    root.append(style);
  }

  function install(win) {
    const { document, gBrowser } = win;
    const tabs = gBrowser?.tabContainer;
    if (!tabs || typeof gBrowser.explicitUnloadTabs !== "function") return;
    if (document.getElementById("native-tab-minus-style")) return;

    const style = document.createElementNS("http://www.w3.org/1999/xhtml", "style");
    style.id = "native-tab-minus-style";
    style.textContent = `
      #tabbrowser-tabs[orient="vertical"] .tabbrowser-tab:hover .tab-close-button[data-native-tab-minus] {
        list-style-image: url("chrome://global/skin/icons/minus.svg");
      }
    `;
    document.documentElement.append(style);

    const labelAttrs = ["data-l10n-id", "data-l10n-args", "tooltiptext", "aria-label"];
    const unloading = new WeakSet();
    let hoveredTab;
    let dash = null;
    let oldLabels;
    let pressed;
    let lastUnloadButton;
    let middlePress;

    function tabOf(node) {
      const tab = node?.closest?.("tab.tabbrowser-tab");
      return tab && tabs.contains(tab) ? tab : null;
    }

    function isUnloaded(tab) {
      return tab.matches("[pending], [discarded]");
    }

    function closesOnMiddleClick(tab) {
      return isUnloaded(tab) || tab.isEmpty;
    }

    function canUnload(tab) {
      return tabs.getAttribute("orient") === "vertical" &&
        !!tab?.linkedPanel && tab.linkedBrowser?.isRemoteBrowser &&
        !tab.closing && !isUnloaded(tab) && !tab.isEmpty;
    }

    function refresh() {
      const next = canUnload(hoveredTab) && !hoveredTab.pinned
        ? hoveredTab.querySelector(".tab-close-button")
        : null;
      if (next === dash) return;
      if (dash) {
        dash.removeAttribute("data-native-tab-minus");
        labelAttrs.forEach((name, index) => {
          const value = oldLabels[index];
          if (value === null) dash.removeAttribute(name);
          else dash.setAttribute(name, value);
        });
      }
      dash = next;
      if (!dash) return;
      oldLabels = labelAttrs.map(name => dash.getAttribute(name));
      dash.removeAttribute("data-l10n-id");
      dash.removeAttribute("data-l10n-args");
      dash.setAttribute("tooltiptext", "Unload Tab");
      dash.setAttribute("aria-label", "Unload Tab");
      dash.setAttribute("data-native-tab-minus", "");
    }

    tabs.addEventListener("pointerover", event => {
      if (event.pointerType !== "mouse") return;
      hoveredTab = tabOf(event.target);
      refresh();
    });
    tabs.addEventListener("pointerout", event => {
      if (event.pointerType !== "mouse" || tabOf(event.relatedTarget) === hoveredTab) return;
      hoveredTab = null;
      refresh();
    });
    for (const name of ["TabAttrModified", "TabRemotenessChange", "SSTabRestoring", "SSTabRestored"]) {
      tabs.addEventListener(name, event => {
        if (event.target === hoveredTab) refresh();
      });
    }
    new win.MutationObserver(refresh).observe(tabs, { attributes: true, attributeFilter: ["orient"] });

    function closeButtonOf(event) {
      const node = event.composedTarget ?? event.target;
      return tabOf(node) ? node.closest(".tab-close-button") : null;
    }

    async function unloadTab(tab) {
      if (!canUnload(tab) || unloading.has(tab)) return;
      unloading.add(tab);
      try {
        await gBrowser.explicitUnloadTabs([tab]);
      } catch (error) {
        Components.utils.reportError(error);
      } finally {
        unloading.delete(tab);
        refresh();
      }
    }

    function middleClick(event) {
      const press = middlePress;
      middlePress = null;
      const tab = tabs.getAttribute("orient") === "vertical" && tabOf(event.composedTarget ?? event.target);
      if (!tab) return;

      event.preventDefault();
      event.stopImmediatePropagation();
      if (tab.closing || unloading.has(tab)) return;
      const close = closesOnMiddleClick(tab);
      if (press?.tab === tab && press.close !== close) return;

      if (close) {
        gBrowser.removeTab(tab, { animate: true, triggeringEvent: event });
      } else {
        void unloadTab(tab);
      }
    }

    win.addEventListener("pointerdown", event => {
      if (event.button === 1) {
        const tab = tabs.getAttribute("orient") === "vertical" && tabOf(event.composedTarget ?? event.target);
        middlePress = tab && !tab.closing ? { tab, close: closesOnMiddleClick(tab) } : null;
        return;
      }
      if (event.button !== 0) return;
      const button = closeButtonOf(event);
      pressed = button ? { button, unload: button === dash } : null;
    }, true);
    win.addEventListener("pointercancel", () => {
      pressed = null;
      middlePress = null;
    }, true);

    win.addEventListener("click", event => {
      if (event.button === 1) {
        middleClick(event);
        return;
      }
      if (event.button !== 0) return;
      const button = closeButtonOf(event);
      const unload = !!button && button === dash;
      const changed = event.detail > 0 && pressed?.button === button && pressed.unload !== unload;
      const repeated = !!button && event.detail > 1 && lastUnloadButton === button;
      pressed = null;
      lastUnloadButton = unload || repeated ? button : null;
      if (!unload && !changed && !repeated) return;

      // This is a mouse action on the native close button. Stop its close
      // handler even if the tab finishes unloading between press and click.
      event.preventDefault();
      event.stopImmediatePropagation();
      if (!unload || changed || event.detail > 1) return;

      void unloadTab(tabOf(button));
    }, true);
  }
})();
